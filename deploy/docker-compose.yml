# Requires an image built from this authentication-enabled revision; Alpha.2 lacks these APIs.
# Keep the optional GitHub client secret private and readable by UID 65532.
services:
  senlun:
    image: ${SENLUN_SERVICE_IMAGE:?Set SENLUN_SERVICE_IMAGE to an image built from this revision}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SENLUN_LISTEN: "0.0.0.0:8080"
      SENLUN_ALLOW_PUBLIC_LISTEN: "true"
      SENLUN_DATABASE_PATH: /var/lib/senlun/store/senlun.db
      SENLUN_PUBLIC_URL: ${SENLUN_PUBLIC_URL:?Set the exact browser-facing HTTPS origin}
      SENLUN_TRUSTED_PROXY_IP: ${SENLUN_TRUSTED_PROXY_IP:-}
      # Optional GitHub OAuth: uncomment these and the two secret entries below together.
      # SENLUN_GITHUB_CLIENT_ID: ${SENLUN_GITHUB_CLIENT_ID}
      # SENLUN_GITHUB_CLIENT_SECRET_FILE: /run/secrets/senlun_github_secret
      # SENLUN_GITHUB_ALLOWED_USER_ID: ${SENLUN_GITHUB_ALLOWED_USER_ID}
    volumes:
      - senlun_data:/var/lib/senlun
    # secrets:
    #   - senlun_github_secret

volumes:
  senlun_data:

# secrets:
#   senlun_github_secret:
