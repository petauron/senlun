version: 2
# Routine version PRs are grouped monthly and limited to patch/minor updates so
# dependency churn does not fan out into dozens of weekly full-CI runs. Major
# upgrades and generated-asset refreshes are handled deliberately; Dependabot
# security updates remain enabled.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@vueuse/core"
        update-types:
          - version-update:semver-major
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
