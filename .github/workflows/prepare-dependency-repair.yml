name: Prepare dependency repair metadata

on:
  push:
    branches: [kuddy/126-dependency-repairs]
    paths: [.github/workflows/prepare-dependency-repair.yml]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Use the pinned compiler and standard-library notices
        run: |
          rustup show
          rustup component add rust-docs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Resolve only the approved Rust updates
        run: |
          cargo update --package sysinfo --precise 0.40.3
          cargo update --package uuid --precise 1.29.2
          cargo update --package zip --precise 9.6.0
          cargo fetch --locked
          cargo fmt --all
      - name: Regenerate notices with the existing reviewed generator
        env:
          CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        run: |
          tool_directory=$(mktemp -d)
          trap 'rm -rf "$tool_directory"' EXIT
          archive="$tool_directory/cargo-about.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "$CARGO_ABOUT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$tool_directory" --strip-components=1
          CARGO_ABOUT="$tool_directory/cargo-about" node scripts/rust-licenses.mjs
      - name: Commit metadata only to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock RUST_THIRD_PARTY_LICENSES.html RUST_STDLIB_LICENSES.html crates
          git diff --cached --quiet && exit 0
          git commit -m 'fix(deps): regenerate approved dependency notices'
          git push origin HEAD:refs/heads/kuddy/126-dependency-repairs
