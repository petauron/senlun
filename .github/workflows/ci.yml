name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR and Release Please dispatch use different refs for the same branch.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  SENLUN_BUILD_GIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.scope.outputs.web }}
      rust: ${{ steps.scope.outputs.rust }}
      security: ${{ steps.scope.outputs.security }}
      e2e: ${{ steps.scope.outputs.e2e }}
      container: ${{ steps.scope.outputs.container }}
      source_docker: ${{ steps.scope.outputs.source_docker }}
      version: ${{ steps.scope.outputs.version }}
      rust_packages: ${{ steps.scope.outputs.rust_packages }}
      e2e_projects: ${{ steps.scope.outputs.e2e_projects }}
      stdlib_licenses: ${{ steps.scope.outputs.stdlib_licenses }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # These dependency-free checks take seconds, so they run for every change,
      # including documentation and deploy tooling.
      - name: Run fast repository checks
        run: |
          node --test scripts/ci-scope.test.mjs scripts/brand-names.test.mjs
          python3 -m unittest discover -s deploy -p 'test_brand_*.py'
      - name: Determine CI scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request)
              base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
              node scripts/ci-scope.mjs --base "$base" --head "$HEAD_SHA"
              ;;
            push)
              before_ok=
              if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                # Scoped checks trust the predecessor. Require its own push CI to
                # have succeeded; a failed, cancelled or never-run predecessor
                # makes this commit run everything.
                before_ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$BEFORE_SHA&per_page=100" --jq '.workflow_runs | sort_by(.run_number) | last | if . != null and .head_sha == "'"$BEFORE_SHA"'" and .head_branch == "main" and .status == "completed" and .conclusion == "success" then "ok" else empty end' 2>/dev/null || true)
              fi
              if [ "$before_ok" = "ok" ]; then
                # A squash merge whose tree equals its successful same-repository
                # PR head was already verified. Version-only commits still run
                # their fresh exact-SHA checks (the classifier prefers that path).
                verified=
                main_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
                pr_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == "'"$GITHUB_SHA"'" and .base.ref == "main" and .head.repo.full_name == "'"$GITHUB_REPOSITORY"'")] | if length == 1 then .[0].head.sha else empty end' 2>/dev/null || true)
                if [ -n "$pr_head" ]; then
                  pr_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$pr_head" --jq '.tree.sha // empty' 2>/dev/null || true)
                  pr_ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$pr_head&per_page=100" --jq '.workflow_runs | sort_by(.run_number) | last | if . != null and .head_sha == "'"$pr_head"'" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'" and .status == "completed" and .conclusion == "success" then "ok" else empty end' 2>/dev/null || true)
                  if [ "$pr_tree" = "$main_tree" ] && [ "$pr_ci" = "ok" ]; then
                    verified=--verified-tree
                  fi
                fi
                node scripts/ci-scope.mjs --base "$BEFORE_SHA" --head "$GITHUB_SHA" $verified
              else
                node scripts/ci-scope.mjs --full
              fi
              ;;
            *)
              # Manually dispatched runs always execute everything.
              node scripts/ci-scope.mjs --full
              ;;
          esac

  version:
    name: Version-only release checks
    needs: changes
    if: needs.changes.outputs.version == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependency sources
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-24.04-sources
          cache-bin: false
          cache-targets: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release metadata, lockfiles and Agent build inputs
        env:
          RELEASE_PLEASE_TEST_ROOT: ${{ runner.temp }}/release-please-regression
        run: |
          set -eu
          npm install --prefix "$RELEASE_PLEASE_TEST_ROOT" --ignore-scripts --no-audit --no-fund --package-lock=false release-please@17.6.0
          node scripts/check-release-please.mjs
          node scripts/agent-dependencies.mjs --check
          cargo metadata --locked --format-version 1 > /dev/null
          version=$(cat version.txt)
          test "$(jq -r '."."' .release-please-manifest.json)" = "$version"
          test "$(jq -r .version web/package.json)" = "$version"
          test "$(jq -r .version web/package-lock.json)" = "$version"
          test "$(jq -r '.packages[""].version' web/package-lock.json)" = "$version"
          test "$(jq -r .crates .release-please-manifest.json)" = "$(cat crates/senlun-agent/version.txt)"
      - name: Verify the Web lockfile installs exactly
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

  web:
    name: Web static checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: npm ci
      - name: Verify release recovery safeguards
        working-directory: .
        run: node --test scripts/release-source.test.mjs
      - name: Lint Web source
        run: npm run lint
      - name: Test Web data handling
        run: npm run test:unit
      - name: Build embedded Web assets
        run: npm run build
      - name: Verify third-party notices
        run: npm run verify:licenses
      - name: Verify generated icon source is current
        run: git diff --exit-code -- src/generated/icons.ts

  rust-checks:
    name: Rust checks and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate selected Rust packages
        run: |
          case "$RUST_PACKAGES" in
            "--workspace"|"-p senlun-agent"|"-p senlun-service") echo "Rust package scope: $RUST_PACKAGES" ;;
            *) echo "Unexpected Rust package scope: $RUST_PACKAGES" >&2; exit 1 ;;
          esac
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-24.04-rust-checks
          cache-bin: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify Release Please versions and Agent build inputs
        env:
          RELEASE_PLEASE_TEST_ROOT: ${{ runner.temp }}/release-please-regression
        run: |
          npm install --prefix "$RELEASE_PLEASE_TEST_ROOT" --ignore-scripts --no-audit --no-fund --package-lock=false release-please@17.6.0
          node scripts/check-release-please.mjs
          node scripts/agent-dependencies.mjs --check
      # Real Web builds are verified by `web` and `e2e`; a constant stub satisfies
      # RustEmbed without running Vite here or invalidating the Service crate cache.
      - name: Prepare deterministic embedded Web stub
        if: env.RUST_PACKAGES != '-p senlun-agent'
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>Senlun</title>\n' > web/dist/index.html
      - name: Run Clippy
        # RUST_PACKAGES is validated above and intentionally word-split.
        run: cargo clippy --locked $RUST_PACKAGES --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked $RUST_PACKAGES --all-targets

  security:
    name: Dependency security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependency sources
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-24.04-sources
          cache-bin: false
          cache-targets: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit production Web dependencies
        working-directory: web
        run: |
          npm ci
          npm ls tinypool --all
          npm audit --omit=dev --audit-level=high
      - name: Audit and constrain Rust dependencies
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          tool_directory=$(mktemp -d)
          trap 'rm -rf "$tool_directory"' EXIT
          archive="$tool_directory/cargo-deny.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$tool_directory" --strip-components=1
          "$tool_directory/cargo-deny" --version
          "$tool_directory/cargo-deny" --all-features --locked check advisories licenses sources
      - name: Verify Rust redistribution licenses and notices
        # A content-verified version-only change cannot alter the dependency
        # graph or the version-free license template, so it skips regeneration.
        if: needs.changes.outputs.version != 'true'
        env:
          CARGO_ABOUT_VERSION: 0.9.2
          CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
          CHECK_STDLIB_LICENSES: ${{ needs.changes.outputs.stdlib_licenses }}
        run: |
          set -eu
          tool_directory=$(mktemp -d)
          trap 'rm -rf "$tool_directory"' EXIT
          archive="$tool_directory/cargo-about.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$CARGO_ABOUT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$tool_directory" --strip-components=1
          cargo fetch --locked
          case "$CHECK_STDLIB_LICENSES" in
            true)
              rustup component add rust-docs
              CARGO_ABOUT="$tool_directory/cargo-about" node scripts/rust-licenses.mjs --check
              ;;
            false)
              CARGO_ABOUT="$tool_directory/cargo-about" node scripts/rust-licenses.mjs --check --skip-stdlib
              ;;
            *)
              echo "Unexpected stdlib_licenses scope: $CHECK_STDLIB_LICENSES" >&2
              exit 1
              ;;
          esac

  e2e:
    name: Browser tests (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Each device project runs against its own fresh Service and Agent.
        project: ${{ fromJson(needs.changes.outputs.e2e_projects) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Playwright project
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: |
          case "$PLAYWRIGHT_PROJECT" in
            desktop-chromium|mobile-chromium) ;;
            *) echo "Unexpected Playwright project: $PLAYWRIGHT_PROJECT" >&2; exit 1 ;;
          esac
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ubuntu-24.04-e2e
          cache-bin: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-ubuntu-24.04-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium
        working-directory: web
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -eu
          find_shell() {
            find "$HOME/.cache/ms-playwright" \( -name chrome-headless-shell -o -name headless_shell \) -type f 2>/dev/null | head -n 1 || true
          }
          shell_bin=$(find_shell)
          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ] && [ -n "$shell_bin" ] && [ -x "$shell_bin" ]; then
            echo "Reusing cached Chromium headless shell: $shell_bin"
          else
            npx playwright install --only-shell chromium
            shell_bin=$(find_shell)
          fi
          if [ -z "$shell_bin" ] || [ ! -x "$shell_bin" ]; then
            echo "Chromium headless shell binary was not found after installation" >&2
            exit 1
          fi
          ldd_output=$(ldd "$shell_bin")
          case "$ldd_output" in
            *"not found"*) npx playwright install-deps chromium ;;
          esac
      - name: Build Web assets
        working-directory: web
        run: npm run build
      - name: Run real Service and Agent browser and accessibility flows
        working-directory: web
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: npx playwright test --project="$PLAYWRIGHT_PROJECT"

  container:
    name: Debian 12 binaries and non-root container smoke test
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Debian 12 Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: bookworm-native-${{ hashFiles('scripts/build-linux-release.sh', 'scripts/Dockerfile.native-builder') }}
          cache-bin: false
      - name: Install Node.js for embedded Web assets
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare native builder and embedded Web assets
        env:
          SENLUN_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: |
          set -eu
          sh scripts/build-linux-release.sh --prepare-builder &
          builder_pid=$!
          web_status=0
          (cd web && npm ci && npm run build) || web_status=$?
          builder_status=0
          wait "$builder_pid" || builder_status=$?
          test "$web_status" -eq 0
          test "$builder_status" -eq 0
      - name: Build and verify release binaries on Debian 12
        env:
          SENLUN_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: sh scripts/build-linux-release.sh
      - name: Verify release image packaging
        run: |
          mkdir -p image/amd64/web
          install -m 0755 target/release/senlun-service target/release/senlun-agent image/amd64/
          install -m 0644 LICENSE NOTICE RUST_THIRD_PARTY_LICENSES.html RUST_STDLIB_LICENSES.html image/amd64/
          install -m 0644 target/release/MUSL_COPYRIGHT.txt image/amd64/
          install -m 0644 web/THIRD_PARTY_NOTICES.md web/LICENSE.* web/dist/THIRD_PARTY_LICENSES.md image/amd64/web/
          docker build --file Dockerfile.release --build-arg "SENLUN_BUILD_GIT_HASH=$SENLUN_BUILD_GIT_HASH" --tag senlun-ci image
      - name: Verify runtime identity and health
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:18081:8080 senlun-ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "65532:65532"
          docker exec "$container_id" senlun-service --version
          docker exec "$container_id" senlun-agent --version
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  source-docker:
    name: Source Dockerfile build and non-root smoke test
    needs: changes
    if: needs.changes.outputs.source_docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the source Dockerfile with the pinned toolchain
        run: docker build --file Dockerfile --build-arg "SENLUN_BUILD_GIT_HASH=$SENLUN_BUILD_GIT_HASH" --tag senlun-source-ci .
      - name: Verify runtime identity and health
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:18082:8080 senlun-source-ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "65532:65532"
          docker exec "$container_id" senlun-service --version
          docker exec "$container_id" senlun-agent --version
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  # Keep this job ID stable: protected main requires the single `rust` check.
  # It requires every selected job to succeed and every unselected job to be
  # skipped, so a change-scoped run can never pass by silently dropping a job.
  rust:
    needs: [changes, version, web, rust-checks, security, e2e, container, source-docker]
    # A cancelled duplicate must not leave a failed required check on its PR.
    # Ordinary failed/skipped dependencies still execute the fail-closed gate.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected CI job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERSION_SELECTED: ${{ needs.changes.outputs.version }}
          VERSION_RESULT: ${{ needs.version.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust-checks.result }}
          SECURITY_SELECTED: ${{ needs.changes.outputs.security }}
          SECURITY_RESULT: ${{ needs.security.result }}
          E2E_SELECTED: ${{ needs.changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CONTAINER_SELECTED: ${{ needs.changes.outputs.container }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          SOURCE_DOCKER_SELECTED: ${{ needs.changes.outputs.source_docker }}
          SOURCE_DOCKER_RESULT: ${{ needs.source-docker.result }}
        run: |
          set -eu
          test "$CHANGES_RESULT" = success
          require() {
            if [ "$2" = true ]; then expected=success; else expected=skipped; fi
            if [ "$3" != "$expected" ]; then
              echo "$1: expected $expected, got $3" >&2
              exit 1
            fi
            echo "$1: $3"
          }
          require version "$VERSION_SELECTED" "$VERSION_RESULT"
          require web "$WEB_SELECTED" "$WEB_RESULT"
          require rust-checks "$RUST_SELECTED" "$RUST_RESULT"
          require security "$SECURITY_SELECTED" "$SECURITY_RESULT"
          require e2e "$E2E_SELECTED" "$E2E_RESULT"
          require container "$CONTAINER_SELECTED" "$CONTAINER_RESULT"
          require source-docker "$SOURCE_DOCKER_SELECTED" "$SOURCE_DOCKER_RESULT"
