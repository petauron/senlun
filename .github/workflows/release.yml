name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished Release Please draft to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  prepare:
    name: Prepare release from checked main
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'senlun-agent-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.source.outputs.release_created }}
      release_sha: ${{ steps.source.outputs.release_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      provenance: ${{ steps.source.outputs.provenance }}
      pending_draft: ${{ steps.pending.outputs.exists }}
      agent_created: ${{ steps.agent.outputs.created }}
      agent_tag: ${{ steps.agent.outputs.tag }}
      agent_sha: ${{ steps.agent.outputs.sha }}
    steps:
      - name: Wait for the exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 180); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100" \
              --jq '.workflow_runs | sort_by(.run_number) | last | if . == null then "waiting" elif .status == "completed" then .conclusion else "waiting" end')
            case "$result" in
              success) exit 0 ;;
              waiting) sleep 10 ;;
              *) echo "Source CI did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for source CI" >&2
          exit 1
      - name: Require this run to match protected main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Recovery must run from current protected main" >&2
            exit 1
          fi
      - name: Check out checked release tooling
        if: steps.current.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve unfinished release drafts
        if: github.event_name == 'push' && steps.current.outputs.matches == 'true'
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft) | .tag_name')
          if [ -n "$pending" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "An unfinished draft exists; use the documented recovery dispatch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create release without updating the next version PR
        if: github.event_name == 'push' && steps.current.outputs.matches == 'true' && steps.pending.outputs.exists != 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-pull-request: true
      - name: Resolve and validate the immutable release source
        if: steps.current.outputs.matches == 'true' && (github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true')
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || steps.release.outputs.tag_name }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/release-source.mjs
      - name: Resolve the matching Agent draft
        if: steps.source.outputs.release_created == 'true'
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.release_sha }}
          CREATED_AGENT_TAG: ${{ steps.release.outputs['crates--tag_name'] }}
          CREATED_AGENT_SHA: ${{ steps.release.outputs['crates--sha'] }}
          CREATED_AGENT: ${{ steps.release.outputs['crates--release_created'] }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$CREATED_AGENT" = true ]; then
              test "$CREATED_AGENT_SHA" = "$SOURCE_SHA"
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "tag=$CREATED_AGENT_TAG" >> "$GITHUB_OUTPUT"
              echo "sha=$CREATED_AGENT_SHA" >> "$GITHUB_OUTPUT"
            fi
          else
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -r --arg sha "$SOURCE_SHA" '.[] | select(.draft and (.tag_name | startswith("senlun-agent-v"))) | select(.target_commitish == $sha) | .tag_name')
            count=$(printf '%s\n' "$tags" | sed '/^$/d' | wc -l)
            test "$count" -le 1
            if [ "$count" -eq 1 ]; then
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "tag=$tags" >> "$GITHUB_OUTPUT"
              echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify-source:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      AGENT_CREATED: ${{ needs.prepare.outputs.agent_created }}
      AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
      AGENT_SHA: ${{ needs.prepare.outputs.agent_sha }}
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    name: Verify protected release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub hides draft releases from tokens without push-level access.
      contents: write
      checks: read
      actions: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a checked protected-main commit and matching versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          release_version=${RELEASE_TAG#v}
          test "$(jq -r '."."' .release-please-manifest.json)" = "$release_version"
          test "$(cat version.txt)" = "$release_version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SHA"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          fi
          cargo_versions=$(cargo metadata --locked --no-deps --format-version 1)
          cargo_version=$(printf '%s' "$cargo_versions" | jq -r '.packages[] | select(.name == "senlun-service") | .version')
          protocol_version=$(printf '%s' "$cargo_versions" | jq -r '.packages[] | select(.name == "senlun-protocol") | .version')
          agent_version=$(printf '%s' "$cargo_versions" | jq -r '.packages[] | select(.name == "senlun-agent") | .version')
          web_version=$(jq -r .version web/package.json)
          test "$cargo_version" = "$release_version"
          test "$protocol_version" = "$release_version"
          test "$web_version" = "$release_version"
          test "$agent_version" = "$(cat crates/senlun-agent/version.txt)"
          test "$agent_version" = "$(jq -r '.crates' .release-please-manifest.json)"
          if [ "$AGENT_CREATED" = true ]; then
            test "$AGENT_TAG" = "senlun-agent-v$agent_version"
            test "$AGENT_SHA" = "$RELEASE_SHA"
            test "$(gh release view "$AGENT_TAG" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$AGENT_TAG" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SHA"
          fi
          gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "rust" and .conclusion == "success")] | length')
          test "$gate" -ge 1
          source_ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA&per_page=100" \
            --jq '.workflow_runs | sort_by(.run_number) | last | .conclusion')
          test "$source_ci" = success

  binaries:
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Linux ${{ matrix.arch }} binaries
    needs: [prepare, verify-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Debian 12 Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: bookworm-native-${{ hashFiles('scripts/build-linux-release.sh', 'scripts/Dockerfile.native-builder') }}
          cache-bin: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded Web assets
        working-directory: web
        env:
          SENLUN_BUILD_GIT_HASH: ${{ needs.prepare.outputs.release_sha }}
        run: |
          npm ci
          npm run build
      - name: Build and verify native release binaries on Debian 12
        env:
          SENLUN_BUILD_GIT_HASH: ${{ needs.prepare.outputs.release_sha }}
          SENLUN_BUILD_TARGET: ${{ matrix.target }}
        run: sh scripts/build-linux-release.sh
      - name: Stage release archive
        env:
          ARCHIVE_NAME: senlun-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}
        run: |
          install -d "release/$ARCHIVE_NAME/deploy" "release/$ARCHIVE_NAME/docs" "release/$ARCHIVE_NAME/web" "release/$ARCHIVE_NAME/compat/luminaplus"
          install -m 0755 target/release/senlun-service target/release/senlun-agent "release/$ARCHIVE_NAME/"
          install -m 0644 target/release/MUSL_COPYRIGHT.txt "release/$ARCHIVE_NAME/"
          install -m 0755 deploy/*.sh "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/migrate-environment.py "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/*.service deploy/*.env.example "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 deploy/docker-compose.yml "release/$ARCHIVE_NAME/deploy/"
          install -m 0644 README.md CHANGELOG.md LICENSE NOTICE SECURITY.md Cargo.lock RUST_THIRD_PARTY_LICENSES.html RUST_STDLIB_LICENSES.html "release/$ARCHIVE_NAME/"
          install -m 0644 docs/OPERATIONS.md docs/ARCHITECTURE.md docs/AUTH.md docs/MONITORING.md docs/STORAGE-BENCHMARK.md docs/THEMES.md "release/$ARCHIVE_NAME/docs/"
          install -m 0644 BRANDING.md docs/technical-brand-migration.md "release/$ARCHIVE_NAME/docs/"
          install -m 0644 compat/luminaplus/* "release/$ARCHIVE_NAME/compat/luminaplus/"
          install -m 0644 web/THIRD_PARTY_NOTICES.md web/LICENSE.* web/package-lock.json "release/$ARCHIVE_NAME/web/"
          install -m 0644 web/dist/THIRD_PARTY_LICENSES.md "release/$ARCHIVE_NAME/web/"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -czf "release/$ARCHIVE_NAME.tar.gz" -C release "$ARCHIVE_NAME"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: release/senlun-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: release/senlun-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Stage native assets in the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" \
            "release/senlun-$RELEASE_TAG-linux-$ARCH.tar.gz" \
            "release/senlun-$RELEASE_TAG-linux-$ARCH.spdx.json" --clobber

  container:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Validate ${{ matrix.arch }} container
    needs: [prepare, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            archive_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            archive_arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      # Downloading staged assets also requires access to the release draft.
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download verified native archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.archive_arch }}
        run: |
          mkdir -p release
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir release \
            --pattern "senlun-$RELEASE_TAG-linux-$ARCH.tar.gz"
      - name: Prepare image contents
        run: |
          mkdir -p image/${{ matrix.arch }}
          tar -xzf release/senlun-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.archive_arch }}.tar.gz --strip-components=1 -C image/${{ matrix.arch }}
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=release-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-container-${{ matrix.arch }}
          build-args: SENLUN_BUILD_GIT_HASH=${{ needs.prepare.outputs.release_sha }}

  publish:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Publish GitHub release
    needs: [prepare, binaries, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --dir release \
            --pattern "senlun-$RELEASE_TAG-linux-*.tar.gz" \
            --pattern "senlun-$RELEASE_TAG-linux-*.spdx.json"
      - name: Prepare both native image contents
        run: |
          mkdir -p image/amd64 image/arm64
          tar -xzf release/senlun-${{ needs.prepare.outputs.release_tag }}-linux-x86_64.tar.gz --strip-components=1 -C image/amd64
          tar -xzf release/senlun-${{ needs.prepare.outputs.release_tag }}-linux-aarch64.tar.gz --strip-components=1 -C image/arm64
      - name: Stage adapted theme package and license
        run: |
          install -m 0644 compat/luminaplus/LuminaPlus-v1.3.5-senlun.zip release/
          install -m 0644 compat/luminaplus/LICENSE release/LICENSE.LuminaPlus
      - name: Create checksums
        working-directory: release
        run: sha256sum senlun-*.tar.gz senlun-*.spdx.json LuminaPlus-v1.3.5-senlun.zip LICENSE.LuminaPlus > SHA256SUMS
      - name: Bind provenance to this publication attempt
        id: provenance
        env:
          SOURCE_PROVENANCE: ${{ needs.prepare.outputs.provenance }}
        run: |
          invocation="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          predicate=$(printf '%s' "$SOURCE_PROVENANCE" | jq -c --arg invocation "$invocation" \
            '.runDetails.metadata.invocationId = $invocation')
          echo "predicate=$predicate" >> "$GITHUB_OUTPUT"
      - name: Attest binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
          predicate-type: https://slsa.dev/provenance/v1
          predicate: ${{ steps.provenance.outputs.predicate }}
      - name: Upload assets to the Release Please draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable ARM64 container execution
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Push the validated image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=release-container-amd64
            type=gha,scope=release-container-arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.release_tag }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.prepare.outputs.release_sha }}
          build-args: SENLUN_BUILD_GIT_HASH=${{ needs.prepare.outputs.release_sha }}
      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          predicate-type: https://slsa.dev/provenance/v1
          predicate: ${{ steps.provenance.outputs.predicate }}
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Remove a container published by a failed draft release
        if: (failure() || cancelled()) && steps.draft.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "GitHub Release is already public; retaining its completed container."
            exit 0
          fi
          test "$release_state" = true

          package_name=${GITHUB_REPOSITORY#*/}
          owner_type=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)
          case "$owner_type" in
            Organization) versions_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            User) versions_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100" ;;
            *) echo "unsupported repository owner type: $owner_type" >&2; exit 1 ;;
          esac
          versions=$(gh api --paginate "$versions_endpoint" 2>/dev/null || true)
          if [ -z "$versions" ]; then
            exit 0
          fi
          version_id=$(printf '%s\n' "$versions" | jq -s -r --arg tag "$RELEASE_TAG" \
            'add | [.[] | select(.metadata.container.tags | index($tag))] | first | .id // empty')
          if [ -n "$version_id" ]; then
            case "$owner_type" in
              Organization) delete_endpoint="orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
              User) delete_endpoint="users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id" ;;
            esac
            gh api --method DELETE "$delete_endpoint"
          fi

  publish-agent:
    name: Publish Senlun Agent release
    needs: [prepare, verify-source, publish]
    if: needs.prepare.outputs.agent_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      AGENT_TAG: ${{ needs.prepare.outputs.agent_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out checked publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify, stage, and publish the Agent release
        run: sh scripts/publish-agent-draft.sh

  recover-agent:
    name: Recover Senlun Agent release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'senlun-agent-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      AGENT_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out checked publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the Agent draft's immutable source
        run: |
          set -eu
          printf '%s' "$AGENT_TAG" | grep -Eq '^senlun-agent-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'
          source_sha=$(gh release view "$AGENT_TAG" --json targetCommitish --jq .targetCommitish)
          printf '%s' "$source_sha" | grep -Eq '^[a-f0-9]{40}$'
          service_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.txt?ref=$source_sha" --jq .content | base64 --decode)
          agent_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/crates/senlun-agent/version.txt?ref=$source_sha" --jq .content | base64 --decode)
          printf '%s' "$service_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'
          test "$AGENT_TAG" = "senlun-agent-v$agent_version"
          echo "RELEASE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$service_version" >> "$GITHUB_ENV"
      - name: Verify and complete the original Agent draft
        run: sh scripts/publish-agent-draft.sh

  release-pr:
    name: Prepare next release pull request
    needs: [prepare, publish, publish-agent]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.pending_draft != 'true' && (needs.publish.result == 'success' || (needs.prepare.outputs.release_created != 'true' && needs.publish.result == 'skipped')) && (needs.publish-agent.result == 'success' || (needs.prepare.outputs.agent_created != 'true' && needs.publish-agent.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint short-lived release app token
        id: release_app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Maintain version PR without publishing
        id: release_pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.release_app_token.outputs.token }}
          target-branch: main
          skip-github-release: true

  notify-catalog:
    name: Wake up official catalog reconciler
    needs: [prepare, publish, publish-agent, recover-agent]
    # Explicit !cancelled() is required because prepare and recover-agent are mutually
    # exclusive, so one needed job is always skipped on every release path.
    if: >-
      !cancelled() &&
      github.repository == 'petauron/senlun' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' &&
        needs.publish.result == 'success' &&
        (needs.publish-agent.result == 'success' ||
         (needs.prepare.outputs.agent_created != 'true' && needs.publish-agent.result == 'skipped'))) ||
       needs.recover-agent.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Mint short-lived catalog wakeup token
        id: catalog_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: petauron
          repositories: catalog
          permission-contents: write
      - name: Dispatch zero-payload catalog reconcile signal
        env:
          GH_TOKEN: ${{ steps.catalog_token.outputs.token }}
        run: |
          gh api --method POST repos/petauron/catalog/dispatches \
            -f event_type=catalog-reconcile
